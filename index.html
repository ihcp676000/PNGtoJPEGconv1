<!DOCTYPE html>
<html>
<head>
    <title>JPEG to PNG Converter</title>
</head>
<body>
    <input type="file" id="uploadInput" accept="image/jpeg, image/jpg" />
    <button id="convertBtn">Convert to PNG</button>

    <script>
        let convertedImageURL = "";

        // Step 1: Convert the image and send the URL to Wix Velo
        document.getElementById('convertBtn').addEventListener('click', () => {
            const file = document.getElementById('uploadInput').files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    // Generate the Base64 PNG URL
                    convertedImageURL = canvas.toDataURL('image/png');

                    // Post the URL up to the Wix parent page
                    window.parent.postMessage(convertedImageURL, "*");
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Step 2: Listen for the click signal from your Wix #Button1
        window.addEventListener('message', (event) => {
            if (event.data === 'trigger_download' && convertedImageURL) {
                const link = document.createElement('a');
                link.href = convertedImageURL;
                link.download = 'converted_image.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });
    </script>
</body>
</html>
